# Tests, firmware build and documentation site.
#
# - Every push and pull request: formatting, host tests (including the check that
#   the generated reference pages match the code, and the TOML presets), firmware
#   build + clippy for each Cargo feature combination, for the UART app (repository
#   root) and the Ethernet app (firmware/ethernet/, its own Cargo workspace), site build.
# - Every build: a Flash / RAM table in the job summary (scripts/memsize.py); on
#   pull requests, compared with the same firmware built from the target branch.
# - Push to `main`: the site (Zensical pages + rustdoc API) is published on GitHub
#   Pages, with the commit it was built from in the footer; the node-a / node-b
#   ELF files are kept as artifacts for 30 days. Repository setting needed once:
#   Settings > Pages > Source: GitHub Actions.
# - Tags `v*`: see release.yml.
#
# On-target tests (`cargo test-target`) need a board, so they don't run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - name: rustfmt (rustfmt.toml)
        run: cargo fmt --all -- --check
      # firmware/ethernet/ is its own Cargo workspace: `--all` above doesn't reach it.
      - name: rustfmt (Ethernet app)
        run: cd firmware/ethernet && cargo fmt -- --check

  host-tests:
    name: Host tests (workshop-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects stable + the RISC-V target; rustup installs it.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Unit, property and doc tests + generated pages up to date
        run: cargo test-host --locked
      - name: Examples (firmware/shared/core/examples, included in the docs)
        run: |
          for ex in firmware/shared/core/examples/*.rs; do
            echo "::group::$(basename "$ex")"
            cargo run -q --locked -p workshop-core --target host-tuple --example "$(basename "$ex" .rs)"
            echo "::endgroup::"
          done
      - name: Clippy (core and presets, host)
        run: cargo clippy -p workshop-core -p workshop-presets --target host-tuple --all-targets -- -D warnings
      - name: Every preset loads and validates
        run: cargo presets check

  firmware-eth:
    name: Ethernet firmware (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/ethernet
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default, flags: "" }
          - { name: none, flags: "--no-default-features" }
          - { name: all, flags: "--all-features" }
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/ethernet
          key: eth-${{ matrix.features.name }}
      - name: Build both nodes (UDP presets)
        run: cargo build --release --locked ${{ matrix.features.flags }}
      - name: Build both nodes (TCP presets)
        run: PRESET_NODE_A=node-a-tcp PRESET_NODE_B=node-b-tcp cargo build --release --locked ${{ matrix.features.flags }}
      - name: Clippy (Ethernet firmware)
        run: cargo clippy --release --locked ${{ matrix.features.flags }} -- -D warnings

  firmware:
    name: Firmware (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each Cargo feature must build on its own: features are additive, and a
        # `#[cfg]` mistake usually only shows up with a feature off.
        features:
          - { name: default, flags: "" }
          - { name: none, flags: "--no-default-features" }
          - { name: all, flags: "--all-features" }
          - { name: rtt only, flags: "--no-default-features --features rtt" }
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}
      - name: Build both nodes
        run: cargo build --release --locked ${{ matrix.features.flags }}
      - name: Clippy (firmware)
        run: cargo clippy --release --locked ${{ matrix.features.flags }} -- -D warnings

      # The default build only: memory report, artifacts.
      - name: Build the target branch (pull requests, for the size comparison)
        if: matrix.features.name == 'default' && github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base FETCH_HEAD
          cd ../base && cargo build --release --locked --target-dir ../base-target \
            || echo "::warning::the target branch doesn't build: no size comparison"
      - name: Memory usage
        if: matrix.features.name == 'default'
        run: |
          elf=target/riscv32imafc-unknown-none-elf/release
          base=../base-target/riscv32imafc-unknown-none-elf/release
          {
            echo "### Memory usage (default features)"
            if [ -d "$base" ]; then
              echo "Compared with \`${{ github.base_ref }}\`."
              python3 scripts/memsize.py --markdown --base-dir "$base" $elf/node-a $elf/node-b
            else
              python3 scripts/memsize.py --markdown $elf/node-a $elf/node-b
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the firmware (push to main)
        if: matrix.features.name == 'default' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            target/riscv32imafc-unknown-none-elf/release/node-a
            target/riscv32imafc-unknown-none-elf/release/node-b
          retention-days: 30

  site:
    name: Documentation site
    # Not the firmware matrix: the site goes live as soon as the docs are checked
    # (host tests include the reference pages freshness check). The firmware API
    # docs below still need the firmware to compile.
    needs: [format, host-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install zensical
      - name: Pages (with the commit in the footer)
        run: |
          # A copy of docs/zensical.toml with the build info, read by
          # docs/templates/partials/copyright.html.
          sed '/^\[project.extra\]$/a\
          build_commit = "'"${GITHUB_SHA::7}"'"\
          build_sha = "'"$GITHUB_SHA"'"\
          build_date = "'"$(date -u '+%Y-%m-%d %H:%M UTC')"'"
          ' docs/zensical.toml > docs/zensical.ci.toml
          zensical build --clean -f docs/zensical.ci.toml
      - name: API documentation (rustdoc)
        run: |
          cargo doc -p workshop-core --target host-tuple --no-deps
          cargo doc -p esp32-rust-workshop --no-deps
          mkdir -p docs/site/api/core docs/site/api/firmware
          cp -r target/"$(rustc --print host-tuple)"/doc/. docs/site/api/core/
          cp -r target/riscv32imafc-unknown-none-elf/doc/. docs/site/api/firmware/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
