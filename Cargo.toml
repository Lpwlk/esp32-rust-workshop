[workspace]
members         = ["firmware/uart", "firmware/shared/core", "firmware/shared/presets-tool"]
# Plain `cargo build` / `cargo run` = the UART firmware (firmware/uart). The Ethernet firmware
# (firmware/ethernet) is its own workspace: see its README. Tests: `cargo test-host`, `cargo test-target`.
default-members = ["firmware/uart"]
resolver        = "3"

# Shared by both crates: `field.workspace = true` in each package.
[workspace.package]
edition      = "2024"
rust-version = "1.95"
version      = "0.1.0"
publish      = false
repository   = "https://github.com/Lpwlk/esp32-rust-workshop"

# Versions used by both crates, set once.
[workspace.dependencies]
heapless         = "0.9.3"
smart-leds-trait = "0.3"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Profiles only count in the workspace root, so they live here for the UART firmware and the
# shared crates (the Ethernet firmware has its own, in firmware/ethernet/Cargo.toml).
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
