# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.riscv32imafc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32s31"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

target = "riscv32imafc-unknown-none-elf"


[alias]
# Unit tests, property tests and doc examples of firmware/shared/core, on this computer.
test-host = ["test", "-p", "workshop-core", "-p", "workshop-presets", "--target", "host-tuple"]
# Look at and check the TOML presets (presets/): `cargo presets list`, `cargo presets show eth node-a`,
# `cargo presets check`.
presets = ["run", "-q", "-p", "workshop-presets", "--target", "host-tuple", "--bin", "presets", "--"]
# On-target tests (firmware/uart/tests/hil.rs), flashed and run on one board by probe-rs through its
# USB Serial/JTAG port. With two boards plugged in, pick one with PROBE_RS_PROBE
# (see `probe-rs list`), e.g. PROBE_RS_PROBE=303a:1001:1C:29:04:D0:6C:1A cargo test-target
test-target = [
  "test", "-p", "esp32-rust-workshop", "--test", "hil", "--release",
  "--config", "target.riscv32imafc-unknown-none-elf.runner='probe-rs run --chip=esp32s31 --preverify --always-print-stacktrace --no-location'",
]
