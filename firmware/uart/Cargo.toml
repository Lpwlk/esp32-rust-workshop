[package]
name         = "esp32-rust-workshop"
description  = "Two ESP32-S31 boards talking over UART at 5 Mbaud: the firmware (node-a, node-b)."
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
publish.workspace      = true
repository.workspace   = true

# Two almost identical firmwares: one per ESP32-S31-Function-CoreBoard-1.
# All the logic lives in src/lib.rs; the binaries only differ by node name.

# no_std firmware: the standard test harness can't be built for this target, so
# the lib and binaries have no unit tests. Hardware-independent logic lives in
# firmware/shared/core (tested on the host); on-target tests are in tests/hil.rs.
[lib]
test  = false
bench = false

[[bin]]
name  = "node-a"
path  = "src/bin/node_a.rs"
test  = false
bench = false

[[bin]]
name  = "node-b"
path  = "src/bin/node_b.rs"
test  = false
bench = false

# On-target tests, run on the board by probe-rs: `cargo test-target`.
[[test]]
harness = false
name    = "hil"

[features]
# Cargo features choose what is *compiled in*; what a node does at run time is
# chosen by its `NodeConfig` (src/bin/node_*.rs) and the CLI. Full map:
# docs/book/configuration.md.
default = ["persist", "watchdog"]
# Settings saved in flash with the CLI `save`, applied at boot (`forget` erases them).
persist = ["dep:esp-storage"]
# Hardware watchdog (TIMG0): resets the chip if the main loop stalls for 2 s.
watchdog = []
# RTT console through the debug probe (probe-rs / cargo-embed). Where the output
# goes is then chosen at run time by the `console` setting.
rtt = ["dep:rtt-target"]

[dependencies]
workshop-core = { path = "../shared/core" }
rtt-target = { version = "0.6.2", optional = true }
esp-storage = { version = "0.10.0", features = ["esp32s31"], optional = true }
esp-hal = { version = "~1.2.2", features = ["esp32s31", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s31"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s31",
  "panic-handler",
  "println",
] }
# No `critical-section` feature: it masks interrupts during every print (up to ms
# while USB drains), which would let the 5 Mbaud RX FIFO overflow. We only print
# from the main loop, so the lock isn't needed.
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s31", "auto", "colors"] }
critical-section = "1.2.0"
heapless.workspace = true
# RGB LED (WS2812-type on GPIO60) driven by the RMT peripheral. No chip feature needed:
# esp-hal already has `esp32s31`, and Cargo unifies it.
esp-hal-smartled = "0.18.0"
smart-leds-trait.workspace = true

# Host-side tool the build script uses to turn firmware/uart/presets/*.toml into the node configs.
[build-dependencies]
workshop-presets = { path = "../shared/presets-tool" }

[dev-dependencies]
embedded-test = "0.7.3"

[lints]
workspace = true
