# The ADC app: samples an analog pin of one ESP32-S31 board and streams the samples over Ethernet (UDP) to a
# computer, where tools/adc-fft/adc_fft.py draws the spectrum. Not a board-to-board app: one board, one host.
#
# It is its own Cargo workspace, like firmware/ethernet (esp-hal is taken from git until the S31 Ethernet
# driver is released), and reuses that crate's Ethernet bring-up (`net`) by path.
[workspace]

[package]
name         = "esp32-rust-workshop-adc"
description  = "ESP32-S31 ADC streamed over Ethernet to a computer (continuous mode with DMA): the firmware (adc-stream)."
edition      = "2024"
rust-version = "1.95"
version      = "0.1.0"
publish      = false

[[bin]]
name  = "adc-stream"
path  = "src/bin/adc_stream.rs"
test  = false
bench = false

[lib]
test  = false
bench = false

[dependencies]
workshop-core          = { path = "../shared/core" }
# The Ethernet bring-up (PHY, EMAC, embassy-net); nothing of the node app is used.
esp32-rust-workshop-eth = { path = "../ethernet", default-features = false }

# Same esp-hal revision as firmware/ethernet.
esp-hal                = { git = "https://github.com/esp-rs/esp-hal", rev = "3ee7ec0f15a4019a916af602d45fd51831bf4c1f", features = ["esp32s31", "unstable", "embassy-time-05"] }
esp-rtos               = { git = "https://github.com/esp-rs/esp-hal", rev = "3ee7ec0f15a4019a916af602d45fd51831bf4c1f", features = ["esp32s31", "embassy"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "3ee7ec0f15a4019a916af602d45fd51831bf4c1f", features = ["esp32s31"] }
esp-backtrace          = { git = "https://github.com/esp-rs/esp-hal", rev = "3ee7ec0f15a4019a916af602d45fd51831bf4c1f", features = ["esp32s31", "panic-handler", "println"] }
esp-println            = { git = "https://github.com/esp-rs/esp-hal", rev = "3ee7ec0f15a4019a916af602d45fd51831bf4c1f", default-features = false, features = ["esp32s31", "auto", "colors"] }
# The register-level crate esp-hal is built on (same revision as in Cargo.lock): the LP AHB GDMA that carries
# the ADC samples (src/dma.rs) isn't exposed by esp-hal.
esp32s31               = { version = "0.3", git = "https://github.com/esp-rs/esp-pacs.git", rev = "61f9678" }

embassy-executor   = "0.10.0"
embassy-futures    = "0.1.2"
embassy-net        = { version = "0.9.0", features = ["proto-ipv4", "medium-ethernet", "tcp", "udp"] }
embassy-time       = "0.5.0"
heapless           = "0.9.3"
critical-section   = "1.2.0"

# esp-hal-smartled (a dependency of the Ethernet crate) depends on esp-hal from crates.io: use the pinned git one.
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "3ee7ec0f15a4019a916af602d45fd51831bf4c1f" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
