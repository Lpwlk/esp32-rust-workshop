# =============================================================================================
# Ethernet app: the defaults, written out and documented.
#
# This file is the reference of every setting and what it accepts; a preset only needs to
# list what it changes (`extends = "base"` brings the rest). A test keeps this file equal to
# `NodeConfig::DEFAULT_NET`, so it can't say something the firmware doesn't do.
#
#   cargo presets show eth node-a        what a preset results in
#   cargo presets check                  load and validate every preset
#
# Everything here is also available at run time in the CLI (`set <key> <value>`), except the
# build-time settings: `name`, the pins, the whole [net] section and the [colors].
# =============================================================================================

# Name sent in every frame: 1-12 printable characters, none of `,` `*` `$` or space.
name = "node"

# ---------------------------------------------------------------------------------------------
# Timing
# ---------------------------------------------------------------------------------------------

# Period of the DAT frame sent to the peer while `tx_mode` is "periodic". Sent in the frame, so
# the peer adapts its link timeout to it. A number is ms; units work: "250ms", "2s", "4Hz".
# Range: 10 ms to 1 h.
data_period_ms = 2500

# Period of the stats line in the console (same units). Range: 100 ms to 1 h.
status_period_ms = 10000

# The peer counts as gone ("link DOWN") after this many of *its* data periods without a valid
# frame. Range: 2-100.
link_timeout_periods = 3

# ---------------------------------------------------------------------------------------------
# Jumper button (and BOOT): a change is accepted once the line has been quiet for `debounce_ms`,
# then everything is ignored for `lockout_ms`.
# ---------------------------------------------------------------------------------------------

# Range: 1-1000 ms.
debounce_ms = 30
# Range: 0-5000 ms.
lockout_ms = 1000

# ---------------------------------------------------------------------------------------------
# What the two breadboard LEDs show. One of:
#   "off" | "on" | "blink" | "blink 200" | "blink 2.5Hz"   always off / on / blinking (full period)
#   "button"   on while this node's button is pressed
#   "peer"     on while the *peer's* button is pressed
#   "link"     on while the peer is alive
#   "rx" | "tx"   short flash on each received / sent frame
# ---------------------------------------------------------------------------------------------
led1 = "peer"
led2 = "rx"

# ---------------------------------------------------------------------------------------------
# Traffic
# ---------------------------------------------------------------------------------------------

# When this node sends frames on its own:
#   "periodic"          a DAT frame every `data_period_ms`
#   "periodic 2.5Hz"    same, and sets the period ( `data_period_ms`, if also written, wins)
#   "on-rx"             no DAT: an ECH reply to each frame from the peer, which then shows its
#                       round-trip time
#   "quiet"             nothing on its own (button events only)
tx_mode = "periodic"

# How much the console prints (and `verbose` in the CLI: `verbose` alone goes to the next level, round and round):
#   "silent" (0)  nothing but what you ask for (CLI replies, burst results) and what is wrong (bad frames,
#                 frames that couldn't be sent)
#   "live" (1)    ONE line, updated in place, with the last frame sent or received and the counters.
#                 Lost frames, link events, bursts and errors still scroll as lines.
#   "frames" (2)  every frame on its own line, and the periodic stats line
#   "wire" (3)    frames plus the timing behind each (time since the peer's previous frame, time queued),
#                 ignored button bounces, counters. The raw bytes are `trace`'s: this node's `verbose`
#                 talks about frames, `trace` about what crosses the cable.
verbose = "live"

# Where the console goes: "auto" (USB serial, plus RTT in a build with --features rtt),
# "serial", "rtt" or "both" (the last two need the `rtt` feature).
console = "auto"

# Network trace: what crosses the Ethernet port, decoded (and `trace` in the CLI: `trace` alone goes to
# the next level). Independent of `verbose`.
#   "off" (0)      nothing; the driver doesn't even copy the frames
#   "events" (1)   one line per control frame: ARP, ICMP, TCP SYN/FIN/RST, and what can't be decoded
#   "frames" (2)   every frame decoded layer by layer (Ethernet, IPv4, UDP/TCP, then the node's own
#                  frame), and `trace_bytes` bytes of the raw frame as a hex dump
trace = "off"

# Raw bytes of each traced frame shown as a hex dump, 0-256 (0 = no dump).
trace_bytes = 32

# How a traced frame is laid out (and `trace compact|layers|inside-out` in the CLI):
#   "compact"      one line per frame: direction, protocol, who to whom, flags, the node's own frame
#   "layers"       a header line, then the layers from the cable inwards (Ethernet, IPv4, UDP/TCP, the node's
#                  own frame), then the raw bytes
#   "inside-out"   a header line, then the node's own frame first and the layers back out to the cable
trace_view = "layers"

# The traffic dashboard: bar graphs of what is received and sent, at the bottom of the console above the prompt,
# redrawn in place while `trace` is on (and `dash` in the CLI: `dash` alone goes to the next size):
#   "off" (0)      not shown
#   "mini" (1)     the fewest lines
#   "normal" (2)   a few more
#   "full" (3)     the most; how many lines depends on the view below (bars 2/3/5, chart 3/6/8, mix 4/9/14, the first of them a thin rule above the graphs)
trace_dash = "normal"

# What the dashboard draws (and `dash bars|chart|mix` in the CLI: `dash` alone goes to the next view):
#   "bars"    a small bar graph per direction, with its rate
#   "chart"   the traffic as a time series: bit rate over the window with a time axis, and beside it frames
#             per second, the average frame size, the peak and the use of the link
#   "mix"     the chart, and under it the protocols that went by ranked as horizontal bars on colored
#             backgrounds (the `mix_*` colors below)
trace_dash_view = "bars"

# Time the dashboard's graphs cover, 2-3600 seconds ("30", "30s", "2min"; `window` in the CLI). Each column of
# a graph is a slice of it: 30 s over the 40 columns of "normal" is 750 ms a column.
trace_window_s = 30

# The compact trace (`trace compact`) writes the addresses of this node's subnet short, `.12` for
# 192.168.77.12 (`set trace_short_ip on`). Off: always whole.
trace_short_ip = false

# ---------------------------------------------------------------------------------------------
# Sections. In TOML every key written after a [section] header belongs to that section, so the
# plain settings above must stay above the first [section]; in a preset too.
# ---------------------------------------------------------------------------------------------

# GPIO numbers. GPIO5-19 belong to the Ethernet PHY and are refused here. All different.
[pins]
# Jumper to GND (internal pull-up): plugged = pressed.
button = 4
# Breadboard LEDs: GPIO -> 330 ohm -> LED anode, cathode -> GND.
led1   = 20
led2   = 21

# The link to the other node: the board's RJ45, two boards cabled to each other or through a
# switch. Static addresses, there is no DHCP. Both nodes use the same transport and port, and
# each one's `peer` is the other's `address`.
[net]
# "udp": one frame per datagram, frames can be lost (the `seq` check shows it).
# "tcp": one connection, nothing is lost (see `tcp_role`).
transport = "udp"
# This node's address, and the subnet size (24 = 255.255.255.0): 8-30.
address    = "192.168.77.11"
prefix_len = 24
# The other node's address, same subnet.
peer       = "192.168.77.12"
# Port of the frames (UDP, or the TCP server's), 1024-65534. The traffic generator (`gen`) uses the next port.
port       = 7000
# TCP only: "server" listens, "client" connects (and retries until the server is there).
tcp_role   = "client"
# Fastest link speed allowed, Mbit/s: 1000 or 100. 1000 needs the MPLL at 500 MHz, which the
# firmware sets; 100 keeps esp-hal's default (400 MHz, what 200 MHz PSRAM needs).
max_speed  = 1000

# On-board RGB LED (GPIO60, not configurable).
[rgb]
# viridis | sunset | ocean | aurora | sakura (`list` in the CLI previews them)
pattern    = "viridis"
# Refresh rate: 1-200 Hz (a number is Hz; "20ms" works too)
freq_hz    = 50
# Duration of one fade loop, lower = faster: 200-60000 ms
cycle_ms   = 6000
# 0-100 %
brightness = 40

# Defaults of the CLI `burst` command.
[burst]
# Frames per burst: 1-100000
count   = 1000
# Frames per second: 0.1-20000, or 0 = back to back, as fast as the link allows
rate_hz = 0

# Colors of the console, by role: a value is the SGR parameters of an ANSI escape code, numbers separated by `;`
# ("31" red, "1;33" bold yellow, "38;5;208" 256-color orange, "38;2;255;128;0" RGB, "" no color). Fixed at
# build time: they are not runtime settings, `set` can't change them. Bold and faint are not roles: the
# console adds them itself where they help. The `mix_*` roles are backgrounds ("30;44" is black on blue): the
# bars of the dashboard's protocol ranking are spaces painted with them, and the text on a bar uses the
# foreground.
[colors]
# The time stamp at the start of a line.
time      = "90"
# Labels and secondary text.
dim       = "90"
# The `│` between the columns of a line.
sep       = "90"
# The `TX ▶` arrow, and what was sent.
tx        = "36"
# The `RX ◀` arrow, and what was received.
rx        = "32"
# Node names, and the peer's.
node      = "33"
# Good news: link up, checks passed.
ok        = "32"
# Things to look at: lost frames, control frames.
warn      = "33"
# Errors, bad checksums, link down.
error     = "31"
# Frames of the cards, names of settings and commands.
accent    = "36"
# Ordinary data frames in the trace.
info      = "34"
# The `cli ›` prompt and the echo of what you typed.
prompt    = "35"
# Link events and the negotiated speed.
link      = "35"
# The `DAT` badge (periodic data).
dat       = "30;47"
# The `EVT` badge (button events).
evt       = "30;43"
# The `ECH`/`BAU` badge (link control).
lnk       = "30;45"
# Trace: the Ethernet layer.
eth       = "34"
# Trace: the IPv4 and ARP layers.
ip        = "35"
# Trace: the UDP, TCP and ICMP layer.
transport = "36"
# Trace: the node's own frames inside the packet.
app       = "33"
# Trace: the hex dump.
raw       = "90"
# Dashboard protocol ranking: the UDP bar (a background).
mix_udp   = "30;44"
# Dashboard protocol ranking: the TCP bar.
mix_tcp   = "30;42"
# Dashboard protocol ranking: the ARP bar.
mix_arp   = "30;43"
# Dashboard protocol ranking: the ICMP bar.
mix_icmp  = "30;45"
# Dashboard protocol ranking: other IPv4 protocols.
mix_ip    = "30;46"
# Dashboard protocol ranking: everything else.
mix_other = "30;100"
